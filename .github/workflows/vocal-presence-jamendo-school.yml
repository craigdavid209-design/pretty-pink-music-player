name: Vocal Presence Jamendo School

on:
  push:
    paths:
      - 'tools/vocal_presence_school_v3.py'
      - 'tests/test_vocal_presence_school_v3.py'
      - '.github/workflows/vocal-presence-jamendo-school.yml'
  workflow_dispatch:

jobs:
  held-out-voice-truth:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run local truth boundaries
        run: python tests/test_vocal_presence_school_v3.py
      - name: Download public Jamendo-VAD truth corpus
        run: |
          mkdir -p /tmp/jamendo
          curl -L --fail --retry 4 --retry-delay 3 \
            'https://zenodo.org/records/2585988/files/jamando.zip?download=1' \
            -o /tmp/jamando.zip
          echo '4d6b907b224c6df3a5ed3ffc3e98b8b1  /tmp/jamando.zip' | md5sum -c -
          unzip -q /tmp/jamando.zip -d /tmp/jamendo
          echo 'Jamendo top-level sample:'
          find /tmp/jamendo -maxdepth 3 -type f | head -40
      - name: Train tiny student and run held-out exam
        run: |
          mkdir -p reports/vocal-presence-v3-ci
          python tools/vocal_presence_school_v3.py train-eval /tmp/jamendo reports/vocal-presence-v3-ci --sr 16000
      - name: Upload derived reports and coefficients only
        uses: actions/upload-artifact@v4
        with:
          name: vocal-presence-v3-jamendo
          path: reports/vocal-presence-v3-ci/
          if-no-files-found: error
          retention-days: 90
