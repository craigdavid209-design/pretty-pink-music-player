name: Scene Balance Comfort Restore v1

on:
  push:
    paths:
      - 'tools/scene_balance_comfort_restore_v1.py'
      - 'tests/test_scene_balance_comfort_restore_v1.py'
      - '.github/workflows/scene-balance-comfort-restore-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  invariant-school:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pytest
        run: python -m pip install pytest
      - name: Run comfort-restore invariant tests
        run: python -m pytest -q tests/test_scene_balance_comfort_restore_v1.py
