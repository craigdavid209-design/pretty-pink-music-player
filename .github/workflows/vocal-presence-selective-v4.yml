name: Vocal Presence Selective v4

on:
  push:
    paths:
      - 'tools/vocal_presence_school_v4.py'
      - 'tools/vocal_presence_selective_v4.py'
      - '.github/workflows/vocal-presence-selective-v4.yml'
  workflow_dispatch:

jobs:
  held-out-abstention:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Download public Jamendo-VAD truth corpus
        run: |
          mkdir -p /tmp/jamendo
          curl -L --fail --retry 4 --retry-delay 3 'https://zenodo.org/records/2585988/files/jamando.zip?download=1' -o /tmp/jamando.zip
          echo '4d6b907b224c6df3a5ed3ffc3e98b8b1  /tmp/jamando.zip' | md5sum -c -
          unzip -q /tmp/jamando.zip -d /tmp/jamendo
      - name: Train and run sealed selective exam
        run: |
          mkdir -p reports/vocal-presence-selective-v4
          python tools/vocal_presence_selective_v4.py /tmp/jamendo reports/vocal-presence-selective-v4 --sr 16000
      - uses: actions/upload-artifact@v4
        with:
          name: vocal-presence-selective-v4
          path: reports/vocal-presence-selective-v4/
          if-no-files-found: error
          retention-days: 90
