name: Scene Lab Tests

on:
  push:
  pull_request:

jobs:
  synthetic-scene-truth:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run synthetic Scene Probe truth test
        run: python tests/test_scene_probe.py
      - name: Run Scene Understanding truth-boundary test
        run: python tests/test_scene_understanding.py
      - name: Run temporal scene-motion truth test
        run: python tests/test_temporal_scene_motion.py
      - name: Run SUL round-2 truth-boundary test
        run: python tests/test_scene_understanding_v2.py
