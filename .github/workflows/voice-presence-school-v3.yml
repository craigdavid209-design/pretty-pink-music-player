name: Voice Presence School v3

on:
  push:
    paths:
      - 'tools/voice_presence_school_v3.py'
      - '.github/workflows/voice-presence-school-v3.yml'
  workflow_dispatch:

jobs:
  jamendo-public-truth:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Download public Jamendo VAD corpus
        run: |
          mkdir -p /tmp/jamendo
          curl -fL --retry 4 --retry-delay 3 'https://zenodo.org/records/2585988/files/jamando.zip?download=1' -o /tmp/jamando.zip
          unzip -q /tmp/jamando.zip -d /tmp/jamendo
          echo "audio files: $(find /tmp/jamendo -type f \( -iname '*.ogg' -o -iname '*.mp3' -o -iname '*.wav' -o -iname '*.flac' \) | wc -l)"
          echo "label files: $(find /tmp/jamendo -type f \( -iname '*.lab' -o -iname '*.trs' \) | wc -l)"
      - name: Train and test tiny voice-presence student
        run: python tools/voice_presence_school_v3.py /tmp/jamendo voice-presence-v3-report.json
      - name: Upload derived report only
        uses: actions/upload-artifact@v4
        with:
          name: voice-presence-school-v3-report
          path: voice-presence-v3-report.json
          if-no-files-found: error
